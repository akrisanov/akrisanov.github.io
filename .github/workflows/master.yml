on:
  push:
    branches: [master]
  workflow_dispatch:

name: Build and deploy on GitHub Pages

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick fonts-dejavu-core

      - name: Build and verify site
        run: bash scripts/build-site.sh

      - name: Deploy
        uses: shalzz/zola-deploy-action@v0.23.4
        env:
          PAGES_BRANCH: gh-pages
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

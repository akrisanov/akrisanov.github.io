{% component imgswap(main_src, swap_src) %}
<figure class="image-swap">
  <button
    type="button"
    class="image-swap-control"
    data-main-src="{{ main_src }}"
    data-swap-src="{{ swap_src }}"
    aria-label="Toggle comparison image"
    aria-pressed="false"
    onclick="
      const image = this.querySelector('img');
      const showingSwap = this.getAttribute('aria-pressed') === 'true';
      image.src = showingSwap ? this.dataset.mainSrc : this.dataset.swapSrc;
      this.setAttribute('aria-pressed', String(!showingSwap));
    "
  >
    <img
      src="{{ main_src }}"
      class="image-swap-image"
      alt="Image comparison"
      loading="lazy"
      decoding="async"
    />
  </button>
  <figcaption class="media-caption">
    Click to toggle images
  </figcaption>
</figure>
{% endcomponent imgswap %}
